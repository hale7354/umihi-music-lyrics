name: Build APK

on:
  push:
    branches: [ "lyrics-feature" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleStandaloneDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: umihi-music-lyrics-debug
          path: app/build/outputs/apk/standalone/debug/*.apk
